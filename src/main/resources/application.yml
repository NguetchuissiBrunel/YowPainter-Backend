server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: yowpainter-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:EventSaas}}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:landry1928}
    driver-class-name: org.postgresql.Driver
    # Propriete importante pour que Hibernate recupere correctement le metadata multi-schema
    hikari:
      maximum-pool-size: 10
      schema: public

  jpa:
    hibernate:
      ddl-auto: validate # Utilise Flyway maintenant
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration/public
    baseline-on-migrate: true

  # Configuration de l'envoi d'emails (Spring Boot 4)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Configuration
jwt:
  # Doit faire au moins 256 bits (32 caracteres) pour HS256
  secret: ${JWT_SECRET:YowPainterSuperSecretKey1234567890ThisIsLongEnough}
  expiration: 900000 # 15 minutes en ms
  refresh-expiration: 604800000 # 7 jours en ms

# Custom App Properties
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  payment:
    campay:
      app-username: ${CAMPAY_USERNAME}
      app-password: ${CAMPAY_PASSWORD}
      base-url: ${CAMPAY_BASE_URL:https://demo.campay.net/api}
      token-url: /token/
      collect-url: /collect/
      transaction-url: /transaction/

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
