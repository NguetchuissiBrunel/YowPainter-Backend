server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: yowpainter-api

  datasource:
    url: jdbc:postgresql://localhost:5432/EventSaas
    username: postgres
    password: landry1928
    driver-class-name: org.postgresql.Driver
    # Propriete importante pour que Hibernate recupere correctement le metadata multi-schema
    hikari:
      maximum-pool-size: 10
      schema: public

  jpa:
    hibernate:
      ddl-auto: validate # Utilise Flyway maintenant
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration/public
    baseline-on-migrate: true

  # Stripe API Keys (a injecter en env variables)
  stripe:
    api-key: ${STRIPE_API_KEY:sk_test_mock_key}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock_key}

# JWT Configuration
jwt:
  # Doit faire au moins 256 bits (32 caracteres) pour HS256
  secret: ${JWT_SECRET:YowPainterSuperSecretKey1234567890ThisIsLongEnough}
  expiration: 900000 # 15 minutes en ms
  refresh-expiration: 604800000 # 7 jours en ms

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
