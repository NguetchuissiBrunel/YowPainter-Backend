# Blueprint pour Render
databases:
  - name: yowpainter-db
    databaseName: yowpainter_prod
    plan: free
    user: yowpainter_user
    region: frankfurt

services:
  # Service Web Backend (Docker)
  - type: web
    name: yowpainter-api
    runtime: docker
    plan: free
    region: frankfurt 
    envVars:
      # URL de base de données complète (interne)
      - key: DATABASE_URL
        fromDatabase:
          name: yowpainter-db
          property: connectionString

      # Sécurité et Application
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://yowpainter.onrender.com

      # Mail secrets
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
