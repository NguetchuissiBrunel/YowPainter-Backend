# Blueprint pour Render
databases:
  - name: yowpainter-db
    databaseName: yowpainter_prod
    plan: free # Note: L'offre gratuite expire après 90 jours
    user: yowpainter_user

services:
  # Service Web Backend (Spring Boot)
  - type: web
    name: yowpainter-api
    env: java
    plan: free
    region: frankfurt 
    buildCommand: mvn clean install -DskipTests
    startCommand: java -jar target/yowpainter-backend-1.0.0-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: 17
      
      # Connexion à la base de données
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: yowpainter-db
          property: jdbcConnectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: yowpainter-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: yowpainter-db
          property: password

      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://yowpainter.onrender.com

      # Mail secrets (à remplir manuellement sur Render pour plus de sécurité)
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
